version: '3.8'

services:
  backend:
    build:
      context: ${BACKEND_CONTEXT:-./Backend}
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    env_file:
      - .env
    environment:
      - SPRING_CONFIG_LOCATION=${SPRING_CONFIG_LOCATION}
      - SPRING_CONFIG_NAME=${SPRING_CONFIG_NAME}
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${BACKEND_CONFIG_PATH:-./Backend/config}:/config:ro
      - ${BACKEND_LOGS_PATH:-./Backend/logs}:/app/logs
    restart: unless-stopped
    user: ${BACKEND_USER:-spring}
    networks:
      - app-network

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-./Frontend}
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
    volumes:
      - ${NGINX_CONFIG_PATH:-./Nginx/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:${NGINX_VERSION:-1.23-alpine}
    env_file:
      - .env
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ${NGINX_CONFIG_PATH:-./Nginx/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_BUILD_PATH:-./Frontend/build}:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge